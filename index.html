<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x=parseInt(prompt("Ingrese un numero"));

        if(x%2==0)
        {
            document.write("<h1>El numero ingresado es par</h>");
        } 
        else 
        {
            document.write("<h1>El numero ingresado es inpar</h>");
            
        }
    </script>
</body>
</html>
